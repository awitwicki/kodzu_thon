{% extends "layout.html" %}
{% block title %}Log in - kodzuthon{% endblock %}
{% block content %}
<section class="login">
  <h1>Log in</h1>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label>Username
      <input type="text" name="username" maxlength="200" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" maxlength="1024" autocomplete="current-password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
