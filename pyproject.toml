[project]
name = "kodzu-thon"
version = "0.1.0"
description = "Telethon-based Telegram userbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.31.0",
    "basemap==1.4.1",
    "cachetools==5.5.0",
    "googletrans==4.0.2",
    "gtts==2.5.4",
    "influxdb==5.3.2",
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "telethon==1.41.1",
    "google-genai==2.0.0",
    "requests>=2.31",
]

[project.optional-dependencies]
web = [
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "freezegun>=1.4",
    "ruff>=0.5",
    "httpx==0.28.1",
]

[project.scripts]
kodzu-thon = "kodzu_thon.__main__:main"
kodzu-thon-web = "kodzu_thon.web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kodzu_thon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs TEST_DATABASE_URL pointing at a disposable PostgreSQL database whose name contains 'test'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["kodzu_thon.web.repository.MessageFilters"]
