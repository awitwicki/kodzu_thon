[project]
name = "kodzu-thon"
version = "0.1.0"
description = "Telethon-based Telegram userbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "basemap==1.4.1",
    "cachetools==5.5.0",
    "googletrans==4.0.2",
    "gtts==2.5.4",
    "influxdb==5.3.2",
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "telethon==1.41.1",
    "google-genai==2.0.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "freezegun>=1.4",
    "ruff>=0.5",
]

[project.scripts]
kodzu-thon = "kodzu_thon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kodzu_thon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
