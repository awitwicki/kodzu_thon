version: "3.3"
services:
  kodzuthon:
    build: .
    image: kodzuthon
    volumes:
      - kodzuthon-session:/app/session_data
    env_file:
    - .env
    container_name: kodzuthon-container
    networks:
      - kodzuverse
    restart: unless-stopped

  kodzuthon.web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: kodzuthon.web
    container_name: kodzuthon.web-container
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - kodzuverse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  kodzuverse:
    name: kodzuverse_network
    external: true

volumes:
  kodzuthon-session:
